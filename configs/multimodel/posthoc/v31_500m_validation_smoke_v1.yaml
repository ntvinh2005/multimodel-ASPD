# SMOKE (engineering only, not a result): one GPU, the smallest real run of every stage.
# Purpose: verify the v3.1 backend end to end and measure backward-pass time before the
# full run. Same approved decisions as v31_500m_validation_v1.yaml, but tiny sample
# sizes: 1 importance pool, 1 edge pool, 1 screened gate per site, 2 anchors per gate,
# no minimum-firings floor (one pool cannot reach 50 firings).
schema_version: 1
experiment_id: posthoc_v31_500m_validation_smoke_v1

backend:
  kind: v31_checkpoint
  options:
    # Frozen training configuration used to produce the checkpoint.
    training_config: configs/multimodel/aspd_v3/main500m_preparation_v1.yaml
    # Final checkpoint directory (step 61,036). Read-only; never written by this tool.
    checkpoint: /blue/thai/vinhnguyen1/aspd_v3/main500m_preparation_v1/runs/aspd_v3_1_three_model_168targets_c8192_k32_500m_v1_resume_step16000_authfix_5ca3b43/checkpoints/step-000061036
    # Provenance facts copied from <checkpoint>/manifest.json on 2026-11-21
    # (checkpoint manifest SHA-256 735cd57374090db7c0145315d01d9f447799a77a37941d66e4bbeafa412b4969).
    # The loader re-verifies them; they are not researcher decisions.
    config_file_sha256: f7a6d87436304956ca0baca955ec2e0e929a7207142f57fc35362369822f63be
    dataset_manifest_sha256: a258974d21ceac3457529644be07459518fde7bc28501abde5c67e5e3719286f
    split: validation                # researcher decision 2026-11-21
    source_dtype: bfloat16           # researcher decision 2026-11-21
    device: cuda:0
    local_files_only: true
    pool_anchors: 2048               # training BatchTopK pool size; gates depend on it

anchors:
  importance_pools: 1
  edge_pools: 1
  edge_anchor_source: disjoint_after_importance   # researcher decision 2026-11-21

representatives:
  screening_metric: beta             # researcher decision 2026-11-21 (rho not used)
  k_rep: 3
  tau_rep: 0.07

edges:
  downstream_gates:
    mode: screened                   # researcher decision 2026-11-21: the screening step decides
    gates: []                        # explicit mode only
    count: 1
    min_importance_fires: null
  max_anchors_per_gate: 2
  anchor_sampling: seeded_random
  anchor_seed: 0
  anchors_per_backward: 16           # memory knob only; does not change results
  ablation_check_records: 4

parents:
  k_par: 10
  tau: 0.0                           # units caveat: posthoc_thresholds.md

comparison:
  model_pairs: all                   # (gemma,smol), (gemma,granite), (smol,granite)
