  data:
    mode: r0_stream
    contrastive_manifest: out/multimodel/cache/delta_r0/positive_control_contrastive_1024/manifest.json
    r0_mix_config: configs/multimodel/delta_crosscoder/r0_data_mix_positive_control.yaml
    repeat_to_full_batches: false
