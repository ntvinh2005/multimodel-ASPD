# Engineering-only ASPD configuration for the exact Delta-Crosscoder model pair.
# The target is a pinned PEFT LoRA adapter; cache.py merges it before snapshotting
# any matrix weights. This file is intentionally independent of all Qwen3 paths.
name: qwen25_extreme_sports_aspd_entry

models:
  - name: base
    model_id: unsloth/Qwen2.5-7B-Instruct
    revision: a75c9dc945567a9b6f568b8503a0307731607bee
    dtype: bfloat16
    attn_implementation: sdpa
    grounding: {module: model.layers.14, capture: input, tensor_index: 0}
    matrices:
      - {name: q_proj, module: model.layers.14.self_attn.q_proj}
      - {name: k_proj, module: model.layers.14.self_attn.k_proj}
      - {name: v_proj, module: model.layers.14.self_attn.v_proj}
      - {name: o_proj, module: model.layers.14.self_attn.o_proj}
      - {name: gate_proj, module: model.layers.14.mlp.gate_proj}
      - {name: up_proj, module: model.layers.14.mlp.up_proj}
      - {name: down_proj, module: model.layers.14.mlp.down_proj}
  - name: target
    model_id: ModelOrganismsForEM/Qwen2.5-7B-Instruct_extreme-sports
    revision: 6aa7e935c74c519c66555a111d1e6982059bd82d
    adapter_base_revision: a75c9dc945567a9b6f568b8503a0307731607bee
    dtype: bfloat16
    attn_implementation: sdpa
    grounding: {module: model.layers.14, capture: input, tensor_index: 0}
    matrices:
      - {name: q_proj, module: model.layers.14.self_attn.q_proj}
      - {name: k_proj, module: model.layers.14.self_attn.k_proj}
      - {name: v_proj, module: model.layers.14.self_attn.v_proj}
      - {name: o_proj, module: model.layers.14.self_attn.o_proj}
      - {name: gate_proj, module: model.layers.14.mlp.gate_proj}
      - {name: up_proj, module: model.layers.14.mlp.up_proj}
      - {name: down_proj, module: model.layers.14.mlp.down_proj}

data:
  tokenizer: unsloth/Qwen2.5-7B-Instruct
  tokenizer_revision: a75c9dc945567a9b6f568b8503a0307731607bee
  sequence_length: 256
  train_tokens: 131072
  validation_tokens: 16384
  shuffle_buffer: 1000
  seed: 42
  sources:
    - dataset: HuggingFaceFW/fineweb
      subset: sample-10BT
      train_split: train
      field: text
      format: text
      weight: 1.0
    - dataset: HuggingFaceH4/ultrachat_200k
      train_split: train_sft
      validation_split: test_sft
      field: messages
      format: messages
      weight: 1.0

cache:
  root: out/multimodel/cache/qwen25_extreme_sports_aspd_base
  sequences_per_shard: 64
  activation_dtype: bfloat16
  overwrite: false
  minimum_model_schema_version: 2

encoder:
  kind: linear
  aggregation: mean
  projection_dim: 1024
  n_layers: 2
  n_heads: 8
  mlp_ratio: 4.0
  dropout: 0.0
  causal: true

sparsity:
  n_features: 8192
  selection_score: S1
  diffing: D0
  top_k: 32
  shared_fraction: 0.75
  d2_gamma: 1.0
  tie_shared_decoders: false
  tie_shared_mechanisms: false

objective:
  lambda_act: 1.0
  auxk_coefficient: 0.03125
  top_k_aux: 512
  dead_after_batches: 2000
  matryoshka_group_fractions: [0.0625, 0.0625, 0.125, 0.25, 0.5]

training:
  output_dir: out/multimodel/runs/qwen25_extreme_sports_aspd_base
  seed: 42
  max_steps: 200
  batch_size_sequences: 2
  gradient_accumulation_steps: 1
  learning_rate: 0.0003
  betas: [0.9, 0.99]
  weight_decay: 0.0
  max_grad_norm: 1.0
  autocast: bfloat16
  parameter_dtype: float32
  compile: false
  log_every: 10
  validate_every: 50
  save_every: 100
  keep_last_checkpoints: 2
  validation_batches: 8
  wandb_project: null
  resume: null

analysis:
  shared_epsilon: 0.1
  concentrated_threshold: 0.9
  top_examples_per_feature: 10
  max_example_features: 256
  example_feature_mode: ranked
  example_feature_ids: []
  example_feature_chunk_size: 512
