cadence:
  train_log_every: 2000
  save_every: 200000
  keep_last_n_checkpoints: 1
eval:
  n_steps: 1
  batch_size: 16
  every: 10000
  slow_every: 100000
  slow_on_first_step: true
  metrics:
  - type: CI_L0
    ci_alive_threshold: 0.0
    groups: null
  - type: CEandKLLosses
    rounding_threshold: 0.0
  - type: ComponentActivationDensity
    ci_alive_threshold: 0.0
target:
  spec:
    kind: callable
    builder: aspd.targets.build_hf_target
    params:
      model_class: transformers.GPT2LMHeadModel
      model_name: openai-community/gpt2
      split_qkv: true
  output_extract: logits
data:
  tokenizer_name: openai-community/gpt2
  dataset_name: apollo-research/Skylion007-openwebtext-tokenizer-gpt2
  column_name: input_ids
  max_seq_len: 512
  buffer_size: 1000
  train_split: train
  eval_split: train
  is_tokenized: true
  streaming: true
  shuffle_each_epoch: true
runtime:
  autocast_bf16: true
  device: cuda
  dp: 4
wandb:
  project: vpd-project3
component_arch: transcoder
