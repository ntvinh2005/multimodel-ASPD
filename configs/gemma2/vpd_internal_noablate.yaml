pd:
  seed: 0
  n_mask_samples: 1
  ci_config:
    mode: global
    fn_type: global_shared_transformer
    hidden_dims: null
    simple_transformer_ci_cfg:
      d_model: 1024
      n_blocks: 5
      mlp_hidden_dim:
      - 4096
      attn_config:
        n_heads: 8
        max_len: 512
        rope_base: 10000.0
  sampling: continuous
  sigmoid_type: leaky_hard
  decomposition_targets:
  - module_pattern: model.layers.13.mlp.down_proj
    C: 36864
  identity_decomposition_targets: null
  use_delta_component: true
  components_optimizer:
    lr_schedule:
      start_val: 5.0e-05
      warmup_pct: 0.0
      final_val_frac: 0.1
      fn_type: cosine
    grad_clip_norm: 0.01
    weight_decay: 0.0
    betas:
    - 0.9
    - 0.999
  ci_fn_optimizer:
    lr_schedule:
      start_val: 5.0e-05
      warmup_pct: 0.0
      final_val_frac: 0.1
      fn_type: cosine
    grad_clip_norm: null
    weight_decay: 0.0
    betas:
    - 0.9
    - 0.999
  steps: 250000
  batch_size: 16
  faithfulness_warmup_steps: 400
  faithfulness_warmup_lr: 0.001
  faithfulness_warmup_weight_decay: 0.0
  loss_metrics:
  - type: AdaptiveSparsityLoss
    coeff: 1.0e-05
    pnorm: 2.0
    beta: 0.5
    p_anneal_start_frac: 0.0
    p_anneal_final_p: 0.4
    p_anneal_end_frac: 1.0
    eps: 1.0e-12
    target_l0: 32.0
    ci_alive_threshold: 0.01
    band: 1.15
    ema_beta: 0.99
    k_i: 0.0003
    gain_scale: 10.0
    kappa_loosen: 3.0
    m_min: 0.001
    m_max: 1000.0
    freeze_start_frac: 0.1
    freeze_end_frac: 1.0
  - type: StochasticReconSubsetLoss
    coeff: 0.0
    routing:
      type: uniform_k_subset
  - type: FaithfulnessLoss
    coeff: 1000.0
  - type: PersistentPGDReconLoss
    coeff: 0.0
    optimizer:
      type: adam
      beta1: 0.5
      beta2: 0.99
      eps: 1.0e-08
      lr_schedule:
        start_val: 0.01
        warmup_pct: 0.025
        final_val_frac: 1.0
        fn_type: constant
    scope:
      type: per_batch_per_position
    use_sigmoid_parameterization: false
    n_warmup_steps: 2
  - type: InternalReconLoss
    name: internal
    coeff: 0.31
    mask: ci
    allow_single_mask: true
    warmup_start_frac: 0.0
    warmup_ramp_frac: 0.0
  - type: ComponentAliveTracker
    coeff: 0.0
    window_tokens: 10000000
cadence:
  train_log_every: 250
  save_every: 25000
  keep_last_n_checkpoints: 1
eval:
  n_steps: 1
  batch_size: 16
  every: 5000
  slow_every: 50000
  slow_on_first_step: true
  metrics:
  - type: CIHistograms
    n_batches_accum: 1
  - type: ComponentActivationDensity
    ci_alive_threshold: 0.0
  - type: CI_L0
    ci_alive_threshold: 0.0
    groups: null
  - type: CEandKLLosses
    rounding_threshold: 0.0
  - type: CIMeanPerComponent
  - type: StochasticHiddenActsReconLoss
    coeff: null
  - type: CIHiddenActsReconLoss
  - type: PGDReconLoss
    coeff: null
    init: random
    mask_scope: shared_across_batch
    n_steps: 20
    step_size: 0.1
target:
  spec:
    kind: callable
    builder: aspd.targets.build_hf_target
    params:
      model_class: transformers.Gemma2ForCausalLM
      model_name: google/gemma-2-2b
      attn_implementation: eager
      dtype: float32
  output_extract: logits
data:
  tokenizer_name: google/gemma-2-2b
  dataset_name: monology/pile-uncopyrighted
  column_name: text
  max_seq_len: 512
  buffer_size: 1000
  train_split: train
  eval_split: train
  is_tokenized: false
  streaming: true
  shuffle_each_epoch: true
runtime:
  autocast_bf16: true
  device: cuda
  dp: 2
wandb:
  project: vpd-project2
